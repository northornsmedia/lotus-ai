    <rect x="250" y="210" width="64" height="44" rx="6"/><text x="282" y="237" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">100%</text>
    <rect x="320" y="210" width="64" height="44" rx="6"/><text x="352" y="237" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">100%</text>
