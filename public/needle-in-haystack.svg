<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="niahBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </linearGradient>

    <!-- 100% Recall Cell Gradient (Emerald) -->
    <linearGradient id="cellEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="920" height="440" rx="16" fill="url(#niahBg)" stroke="#27272a" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <g transform="translate(40, 38)">
    <circle cx="12" cy="12" r="12" fill="#10b981" fill-opacity="0.2"/>
    <circle cx="12" cy="12" r="5" fill="#10b981"/>
    <text x="34" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700">Needle-in-a-Haystack (NIAH) • 3.2M Context Recall Matrix</text>
    <text x="34" y="36" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Synthetic factual retrieval evaluation across document depths and token lengths up to 3,200,000 tokens</text>
  </g>

  <!-- Side Metrics Card -->
  <g transform="translate(690, 85)">
    <rect width="190" height="280" rx="12" fill="#181820" stroke="#2e2e38" stroke-width="1"/>

    <text x="20" y="32" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.05em">TOTAL RECALL</text>
    <text x="20" y="66" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">100.0%</text>

    <line x1="20" y1="84" x2="170" y2="84" stroke="#27272a"/>

    <text x="20" y="112" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">MAX CONTEXT</text>
    <text x="20" y="136" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">3,200,000 tokens</text>

    <line x1="20" y1="154" x2="170" y2="154" stroke="#27272a"/>

    <text x="20" y="180" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">ATTENTION LOSS</text>
    <text x="20" y="204" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">0.00% (Linear)</text>

    <line x1="20" y1="222" x2="170" y2="222" stroke="#27272a"/>

    <rect x="20" y="240" width="150" height="26" rx="6" fill="#10b981" fill-opacity="0.15"/>
    <text x="95" y="257" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PERFECT RECOVERY</text>
  </g>

  <!-- Grid Axes Labels -->
  <!-- Matrix area: Left: 110, Top: 110. 8 Columns x 5 Rows. -->
  <!-- Col width: 64px, gap: 6px. Row height: 44px, gap: 6px. -->
  <!-- Cols: 8 * 70 = 560px width. -->
  <!-- Rows: 5 * 50 = 250px height. -->

  <!-- Y-Axis (Document Depth) -->
  <g fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="end">
    <text x="100" y="138">Top (0%)</text>
    <text x="100" y="188">25%</text>
    <text x="100" y="238">50%</text>
    <text x="100" y="288">75%</text>
    <text x="100" y="338">Bottom</text>
  </g>

  <!-- Y-Axis Title -->
  <text x="28" y="240" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" transform="rotate(-90, 28, 240)" text-anchor="middle">DOCUMENT DEPTH</text>

  <!-- X-Axis Labels (Context Length) -->
  <g fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
    <text x="142" y="380">128K</text>
    <text x="212" y="380">256K</text>
    <text x="282" y="380">512K</text>
    <text x="352" y="380">1.0M</text>
    <text x="422" y="380">1.5M</text>
    <text x="492" y="380">2.0M</text>
    <text x="562" y="380">2.5M</text>
    <text x="632" y="380">3.2M</text>
    <text x="387" y="405" fill="#71717a" font-size="12">TOKEN CONTEXT LENGTH</text>
  </g>

